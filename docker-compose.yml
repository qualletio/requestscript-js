services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: requestscript
      POSTGRES_PASSWORD: requestscript
      POSTGRES_DB: requestscript
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U requestscript']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
